server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
  error:
    include-message: never
spring:
  application:
    name: mujian
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/mujian?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:mujian}
    password: ${DB_PASSWORD:mujian-local-demo-2026}
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Shanghai
app:
  upload-dir: ${UPLOAD_DIR:uploads}
  jwt-secret: ${JWT_SECRET:local-demo-only-mujian-secret-change-before-deploy-2026}
  seed-demo: ${SEED_DEMO:true}
  admin-password: ${ADMIN_PASSWORD:Admin123!}
  demo-password: ${DEMO_PASSWORD:Demo123!}
