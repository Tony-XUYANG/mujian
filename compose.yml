services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mujian
      MYSQL_USER: mujian
      MYSQL_PASSWORD: ${DB_PASSWORD:-mujian-local-demo-2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-mujian-2026}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
